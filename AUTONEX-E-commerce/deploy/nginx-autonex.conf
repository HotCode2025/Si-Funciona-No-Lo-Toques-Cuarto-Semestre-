# Bloque para publicar AUTONEX en https://gnuino.com.ar/AUTONEX/ (pegar dentro del server { } con SSL,
# en el servidor: /etc/nginx/conf.d/default.conf, junto a /guia-rapida/ y /batchalert/).
# Requiere en server/.env:  BASE_PATH=/AUTONEX  ·  SERVE_FRONTEND=true  ·  PUBLIC_URL=https://gnuino.com.ar/AUTONEX
# y compilar el frontend con VITE_BASE_PATH=/AUTONEX/ (lo hacen deploy/desplegar.sh y deploy/recargar-catalogo.sh).
#
# OJO: proxy_pass va SIN barra final. La app espera recibir la ruta completa (/AUTONEX/...),
# así el frontend, la API (/AUTONEX/api) y el webhook de Mercado Pago comparten el mismo prefijo.
# Después de pegarlo:  sudo nginx -t && sudo systemctl reload nginx

location = /AUTONEX {
    return 301 /AUTONEX/;
}

location ^~ /AUTONEX/ {
    proxy_pass http://127.0.0.1:3200;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    client_max_body_size 2m;
}

# Escrito de otra forma (/autonex, /Autonex/catalogo…): redirige a la dirección oficial en mayúsculas
location ~* ^/autonex(?<resto>/.*)?$ {
    return 301 /AUTONEX$resto$is_args$args;
}
